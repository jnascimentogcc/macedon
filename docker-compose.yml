# Local development stack. Not hardened: do not use these credentials outside your machine.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: macedon
      POSTGRES_PASSWORD: macedon
      POSTGRES_DB: macedon
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macedon"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  s3:
    # S3-compatible object store for local development (MinIO no longer ships a community image).
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "127.0.0.1:9000:8333"
    volumes:
      - s3-data:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/keycloak/macedon-realm.json:/opt/keycloak/data/import/macedon-realm.json:ro

volumes:
  postgres-data:
  s3-data:
