version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # The evaluation group pins these on purpose: newer releases broke the RAGAS run
      # (see backend/eval/README.md). Bump them by hand, together, and re-run the evaluation.
      - dependency-name: ragas
      - dependency-name: langchain-community
      - dependency-name: langchain-openai
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # @angular/build pins the TypeScript range it supports (currently >=6.0 <6.1), so a major
      # bump breaks `npm ci`. Lift this once Angular's peer range allows the new major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
